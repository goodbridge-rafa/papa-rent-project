# Local development: `docker compose -f infra/docker-compose.yml up -d db`
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: papa
      POSTGRES_PASSWORD: papa
      POSTGRES_DB: papa
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papa"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
